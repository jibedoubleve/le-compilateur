<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Le Compilateur</title>
    <base href="/"/>
    <link id="webassembly" rel="preload"/>
    <link href="css/app.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="Compilateur.Web.styles.css" rel="stylesheet" /> -->
    <script type="importmap"></script>
</head>

<body>
<script src="_content/BlazorMonaco/jsInterop.js"></script>
<script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/loader.js"></script>
<script src="_content/BlazorMonaco/lib/monaco-editor/min/vs/editor/editor.main.js"></script>
<script src="js/lox-language.js"></script>

<script>
    const sombre = matchMedia('(prefers-color-scheme: dark)');
    window.applyTheme = () => {
        document.documentElement.dataset.bsTheme = sombre.matches ? 'dark' : 'light';
        window.monaco?.editor.setTheme(sombre.matches ? 'vs-dark' : 'vs');
    };
    applyTheme();
    sombre.addEventListener('change', applyTheme);
</script>


<div id="app">
    <svg class="loading-progress">
        <circle cx="50%" cy="50%" r="40%"/>
        <circle cx="50%" cy="50%" r="40%"/>
    </svg>
    <div class="loading-progress-text"></div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a class="reload" href=".">Reload</a>
    <span class="dismiss">🗙</span>
</div>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
