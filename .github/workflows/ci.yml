name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
  
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
  
      - name: Publish
        run: dotnet publish src/Compilateur.Web/Compilateur.Web.csproj --configuration Release --output publish
  
      - name: Set base path
        run: sed -i 's#<base href="/"/>#<base href="/le-compilateur/"/>#' publish/wwwroot/index.html
  
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  
      - id: deployment
        uses: actions/deploy-pages@v4